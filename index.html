*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.4}

.modal-field input,.modal-field textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-family:var(--sans);font-size:.9rem;outline:none}
.modal-field input:focus,.modal-field textarea:focus{border-color:var(--accent)}
.modal-field textarea{resize:vertical;min-height:80px}
.modal-submit{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer}
.modal-submit:disabled{opacity:.6;cursor:wait}
.modal-success{display:none;text-align:center;padding:20px 0}
.modal-success .icon{font-size:2.6rem;display:block;margin-bottom:10px}
.notice-box{background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:8px;padding:12px;font-size:.78rem;color:var(--orange);margin-bottom:14px;line-height:1.5}
.rates-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.78rem;color:var(--text-mid);margin-bottom:14px;line-height:1.7}
.privacy{font-size:.68rem;color:var(--text-muted);margin-top:10px;line-height:1.5}
.pro-features{list-style:none;margin-bottom:18px}
.pro-features li{padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem}
.pro-features li::before{content:'✓ ';color:var(--green);font-weight:700}
.pro-price{text-align:center;padding:14px;background:var(--surface);border-radius:10px;margin-bottom:14px}
.pro-price-num{font-size:2rem;font-weight:800;font-family:var(--mono)}
.pro-submit{background:linear-gradient(135deg,#f59e0b,#d97706)!important}
.below{max-width:1080px;margin:0 auto;padding:0 20px 40px}
.sep{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.sep div{flex:1;height:1px;background:var(--border)}
.sep span{font-size:.65rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.aff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aff{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;gap:12px}
.aff-title{font-size:.78rem;font-weight:700;margin-bottom:4px}
.aff-text{font-size:.74rem;color:var(--text-mid);line-height:1.5;margin-bottom:8px}
.aff a{font-size:.72rem;font-weight:700;color:var(--accent);text-decoration:none;padding:5px 10px;border:1px solid var(--accent);border-radius:6px;display:inline-block}
.seo{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:26px 30px;box-shadow:var(--shadow);margin-top:20px}
.seo h2{font-size:1rem;font-weight:700;margin-bottom:10px}
.seo h3{font-size:.86rem;font-weight:700;margin:14px 0 6px}
.seo p,.seo li{font-size:.84rem;color:var(--text-mid);line-height:1.7}
.seo ul{padding-left:18px}
footer{text-align:center;padding:20px;color:var(--text-muted);font-size:.72rem;border-top:1px solid var(--border);background:var(--white);line-height:1.7}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:860px){
  .main-grid{grid-template-columns:1fr}
  .results-panel{position:static;max-height:none}
  header{padding:0 14px}
  .page-wrap{padding:18px 14px 40px}
  .card{padding:18px 16px}
  .aff-grid{grid-template-columns:1fr}
  .seo{padding:20px}
}
@media(max-width:520px){
  .form-row,.vol-row{grid-template-columns:1fr}
  .origin-grid{gap:6px}
  .origin-card{padding:10px 4px}
  .origin-sub{display:none}
  .page-title{font-size:1.3rem}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="/" aria-label="ShipCalc"><div class="logo-box">SC</div><div class="logo-text">Ship<span>Calc</span></div></a>
  <div class="header-right">
    <button class="pro-btn" type="button" onclick="openModal('pro-modal')">&#9733; PRO</button>
    <div class="lang-toggle" role="group" aria-label="Idioma / Language">
      <button class="lang-btn" type="button" data-lang="es" onclick="setLang('es')">ES</button>
      <button class="lang-btn" type="button" data-lang="en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<main class="page-wrap">
  <div class="page-header">
    <h1 class="page-title" data-i="title"></h1>
    <p class="page-sub" data-i="subtitle"></p>
    <div class="trust-row">
      <span class="trust-chip" data-i="chip1"></span>
      <span class="trust-chip" data-i="chip2"></span>
      <span class="trust-chip" data-i="chip3"></span>
    </div>
  </div>

  <div class="quick-converter">
    <span class="qc-label" data-i="qc-label"></span>
    <input type="number" class="qc-input" id="qc-amount" placeholder="10000" min="0" inputmode="decimal" aria-label="Amount">
    <select class="qc-select" id="qc-from" aria-label="From">
      <option value="JPY">JPY 🇯🇵</option><option value="KRW">KRW 🇰🇷</option><option value="CNY">CNY 🇨🇳</option>
    </select>
    <span aria-hidden="true">→</span>
    <select class="qc-select" id="qc-to" aria-label="To">
      <option>EUR</option><option>USD</option><option>GBP</option><option>MXN</option><option>ARS</option><option>COP</option><option>CLP</option><option>PEN</option><option>UYU</option><option>PYG</option><option>BOB</option><option>DOP</option><option>GTQ</option><option>CRC</option><option>CAD</option><option>AUD</option>
    </select>
    <div><div class="qc-result" id="qc-result">—</div><div class="qc-rate" id="qc-rate"></div></div>
  </div>

  <div class="main-grid">
    <div class="left-col">
      <section class="card" aria-labelledby="h-step1">
        <div class="card-head"><div class="step-badge">1</div><h2 class="card-title" id="h-step1" data-i="step1"></h2></div>
        <div class="origin-grid" role="radiogroup">
          <div class="origin-card" role="radio" tabindex="0" data-origin="JP"><div class="check-mark">✓</div><span class="origin-flag" aria-hidden="true">🇯🇵</span><div class="origin-name" data-i="o-JP"></div><div class="origin-sub" data-i="o-JP-sub"></div></div>
          <div class="origin-card" role="radio" tabindex="0" data-origin="KR"><div class="check-mark">✓</div><span class="origin-flag" aria-hidden="true">🇰🇷</span><div class="origin-name" data-i="o-KR"></div><div class="origin-sub" data-i="o-KR-sub"></div></div>
          <div class="origin-card" role="radio" tabindex="0" data-origin="CN"><div class="check-mark">✓</div><span class="origin-flag" aria-hidden="true">🇨🇳</span><div class="origin-name" data-i="o-CN"></div><div class="origin-sub" data-i="o-CN-sub"></div></div>
        </div>
      </section>

      <section class="card" aria-labelledby="h-step2">
        <div class="card-head"><div class="step-badge">2</div><h2 class="card-title" id="h-step2" data-i="step2"></h2></div>
        <div class="form-row" style="margin-bottom:12px">
          <div class="field">
            <label for="price" id="price-label"></label>
            <input type="text" id="price" class="mono" inputmode="decimal" autocomplete="off">
          </div>
          <div class="field">
            <label for="weight" data-i="weight-label"></label>
            <div class="inline">
              <input type="text" id="weight" class="mono" inputmode="decimal" autocomplete="off" placeholder="500">
              <select id="wunit" aria-label="Unit"><option value="g">g</option><option value="kg">kg</option></select>
            </div>
            <div class="hint" data-i="weight-hint"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="dest" data-i="dest-label"></label>
            <select id="dest"></select>
          </div>
          <div class="field">
            <label for="cat" data-i="cat-label"></label>
            <select id="cat"></select>
          </div>
        </div>
        <button type="button" class="adv-toggle" id="adv-toggle" aria-expanded="false" aria-controls="adv"></button>
        <div class="adv" id="adv">
          <div class="hint" style="margin-bottom:8px" data-i="vol-note"></div>
          <div class="vol-row">
            <div class="field"><label for="dl" data-i="vol-l"></label><input type="number" id="dl" class="mono" min="0" inputmode="decimal"></div>
            <div class="field"><label for="dw" data-i="vol-w"></label><input type="number" id="dw" class="mono" min="0" inputmode="decimal"></div>
            <div class="field"><label for="dh" data-i="vol-h"></label><input type="number" id="dh" class="mono" min="0" inputmode="decimal"></div>
          </div>
          <div class="field" style="max-width:240px">
            <label for="sdate" data-i="date-label"></label>
            <input type="date" id="sdate" class="mono">
          </div>
          <div class="hint" style="margin-top:6px" data-i="date-hint"></div>
        </div>
        <div id="alerts"></div>
      </section>

      <section class="card" aria-labelledby="h-step3">
        <div class="card-head"><div class="step-badge">3</div><h2 class="card-title" id="h-step3" data-i="step3"></h2></div>
        <div class="hint" style="margin-bottom:10px" data-i="ship-hint"></div>
        <div class="ship-list" id="ship-list"></div>
      </section>

      <section class="card" aria-labelledby="h-step4">
        <div class="card-head"><div class="step-badge muted">4</div><h2 class="card-title" id="h-step4" data-i="step4"></h2><span class="optional-tag" data-i="optional"></span></div>
        <div class="form-row">
          <div class="field">
            <label for="sell" id="sell-label"></label>
            <input type="text" id="sell" class="mono" inputmode="decimal" autocomplete="off" placeholder="0">
          </div>
          <div class="field">
            <label for="platform" data-i="platform-label"></label>
            <select id="platform"></select>
            <div class="hint" id="platform-note"></div>
          </div>
        </div>
      </section>

      <div id="error-msg" class="error-msg" role="alert"></div>
      <button class="calc-btn" type="button" id="calc-btn" data-i="calc-btn"></button>

      <div class="history-section" id="history-section" style="display:none">
        <div class="history-header"><span class="history-title" data-i="history"></span><button class="history-clear" type="button" id="history-clear" data-i="history-clear"></button></div>
        <div id="history-list"></div>
      </div>
    </div>

    <aside class="right-col">
      <div class="results-panel" id="results-panel" aria-live="polite">
        <div class="results-header">
          <div class="results-header-top">
            <div class="results-title-label" data-i="breakdown"></div>
            <div class="rate-live"><div class="live-dot" id="live-dot"></div><span id="live-txt"></span></div>
          </div>
          <div id="rate-display">—</div>
        </div>
        <div class="results-empty" id="results-empty"><span class="icon" aria-hidden="true">📦</span><span data-i="empty-msg"></span></div>
        <div class="results-body" id="results-body"></div>
        <div class="compare-section" id="compare-section">
          <div class="compare-title" data-i="compare"></div>
          <div id="compare-list"></div>
        </div>
      </div>
    </aside>
  </div>
</main>

<div class="below">
  <div class="sep"><div></div><span>ShipCalc</span><div></div></div>
  <div style="font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px" data-i="travel-title"></div>
  <div class="aff-grid">
    <div class="aff"><div style="font-size:1.4rem" aria-hidden="true">📱</div><div><div class="aff-title">Holafly eSIM</div><div class="aff-text" data-i="aff-holafly" data-html="1"></div><a href="https://holafly.sjv.io/c/6760093/2006335/24764" target="_blank" rel="noopener sponsored" data-i="aff-btn"></a></div></div>
    <div class="aff"><div style="font-size:1.4rem" aria-hidden="true">🌐</div><div><div class="aff-title">Saily eSIM</div><div class="aff-text" data-i="aff-saily" data-html="1"></div><a href="https://saily.com/japangemu" target="_blank" rel="noopener sponsored" data-i="aff-btn"></a></div></div>
  </div>

  <article class="seo">
    <h2 data-i="seo-title"></h2>
    <p data-i="seo-p1"></p>
    <h3 data-i="seo-h-ship"></h3>
    <ul>
      <li data-i="seo-jp"></li>
      <li data-i="seo-kr"></li>
      <li data-i="seo-cn"></li>
    </ul>
    <h3 data-i="seo-h-tax"></h3>
    <p data-i="seo-p2"></p>
    <h3 data-i="seo-h-upd"></h3>
    <p data-i="seo-p3"></p>
  </article>
</div>

<footer>
  <div data-i="footer"></div>
  <div data-i="privacy"></div>
  <div>© <span id="year"></span> ShipCalc · shipcalc.live</div>
</footer>

<!-- SEND MODAL (Netlify Forms) -->
<div class="modal-overlay" id="send-modal" role="dialog" aria-modal="true" aria-labelledby="send-title">
  <div class="modal">
    <button class="modal-close" type="button" onclick="closeModal('send-modal')" aria-label="Cerrar">✕</button>
    <div class="modal-title" id="send-title" data-i="send-title"></div>
    <div class="modal-sub" data-i="send-sub"></div>
    <form name="shipcalc-shipping" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="send-form">
      <input type="hidden" name="form-name" value="shipcalc-shipping">
      <p class="sr-only"><label>No rellenar: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div class="modal-field"><label for="sf-name" data-i="sf-name"></label><input type="text" id="sf-name" name="name" required maxlength="120" autocomplete="name"></div>
      <div class="modal-field"><label for="sf-email" data-i="sf-email"></label><input type="email" id="sf-email" name="email" required maxlength="160" autocomplete="email"></div>
      <div class="modal-field"><label for="sf-dest" data-i="sf-dest"></label><input type="text" id="sf-dest" name="destination" required maxlength="80"></div>
      <div class="modal-field"><label for="sf-city" data-i="sf-city"></label><input type="text" id="sf-city" name="city" maxlength="80"></div>
      <div class="modal-field"><label for="sf-weight" data-i="sf-weight"></label><input type="number" id="sf-weight" name="weight_kg" min="0.1" max="100" step="0.1"></div>
      <div class="modal-field"><label for="sf-date" data-i="sf-date"></label><input type="date" id="sf-date" name="date"></div>
      <div class="modal-field"><label for="sf-notes" data-i="sf-notes"></label><textarea id="sf-notes" name="contents" maxlength="1500"></textarea></div>
      <div class="notice-box" data-i="sf-notice" data-html="1"></div>
      <div class="rates-box" data-i="sf-rates" data-html="1"></div>
      <button class="modal-submit" type="submit" data-i="sf-submit"></button>
      <div class="form-msg err" id="send-err"></div>
      <div class="privacy" data-i="form-privacy"></div>
    </form>
    <div class="modal-success" id="send-success"><span class="icon">✓</span><strong data-i="send-ok"></strong><p style="font-size:.85rem;color:var(--text-mid);margin-top:8px" data-i="send-ok-sub"></p></div>
  </div>
</div>

<!-- PRO MODAL (Netlify Forms) -->
<div class="modal-overlay" id="pro-modal" role="dialog" aria-modal="true" aria-labelledby="pro-title">
  <div class="modal">
    <button class="modal-close" type="button" onclick="closeModal('pro-modal')" aria-label="Cerrar">✕</button>
    <div class="modal-title" id="pro-title">ShipCalc PRO</div>
    <div class="modal-sub" data-i="pro-sub"></div>
    <ul class="pro-features"><li data-i="pro-f1"></li><li data-i="pro-f2"></li><li data-i="pro-f3"></li><li data-i="pro-f4"></li></ul>
    <div class="pro-price"><div class="pro-price-num">$5<span style="font-size:1rem;font-weight:400" data-i="pro-mo"></span></div><div class="hint" data-i="pro-price-sub"></div></div>
    <form name="shipcalc-pro" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="pro-form">
      <input type="hidden" name="form-name" value="shipcalc-pro">
      <p class="sr-only"><label>No rellenar: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div class="modal-field"><label for="pro-email" data-i="pro-email-label"></label><input type="email" id="pro-email" name="email" required maxlength="160" autocomplete="email"></div>
      <button class="modal-submit pro-submit" type="submit" data-i="pro-submit"></button>
      <div class="form-msg err" id="pro-err"></div>
      <div class="privacy" data-i="form-privacy"></div>
    </form>
    <div class="modal-success" id="pro-success"><span class="icon">★</span><strong data-i="pro-ok"></strong><p style="font-size:.85rem;color:var(--text-mid);margin-top:8px" data-i="pro-ok-sub"></p></div>
  </div>
</div>

<script>window.SC={origins:{},fuel:{},demand:{}};</script>
<script src="data/japon.js?v=20261029"></script>
<script src="data/corea.js?v=20261029"></script>
<script src="data/china.js?v=20261029"></script>
<script src="data/destinos.js?v=20261029"></script>
<script src="data/motor.js?v=20261029"></script>
<script src="data/app.js?v=20261029"></script>
</body>
</html>
