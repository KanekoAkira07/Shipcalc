<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html"><div class="logo-box">SC</div><span class="lt">Ship<span>Calc</span></span></a>
  <nav class="nav" aria-label="Servicios">
    <a href="maletas.html" class="on" aria-current="page" data-i="nav-bags"></a><a href="calculadora.html" data-i="nav-calc"></a><a href="envio.html" data-i="nav-ship"></a><a href="consigna.html" data-i="nav-store"></a>
  </nav>
  <div class="lang"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div>
</div></header>

<main class="wrap page">
  <div class="grid2">
    <div>
      <h1 data-i="b-title"></h1>
      <p class="lead" data-i="b-lead"></p>
      <ol class="steps">
        <li><div><b data-i="b-s1"></b><span data-i="b-s1d"></span></div></li>
        <li><div><b data-i="b-s2"></b><span data-i="b-s2d"></span></div></li>
        <li><div><b data-i="b-s3"></b><span data-i="b-s3d"></span></div></li>
      </ol>
      <div class="box">
        <h3 data-i="b-info"></h3>
        <ul><li data-i="b-i1"></li><li data-i="b-i2"></li><li data-i="b-i3"></li></ul>
      </div>
      <div class="faq">
        <h3 data-i="faq" style="margin-bottom:4px"></h3>
        <details><summary data-i="q1"></summary><p data-i="a1"></p></details>
        <details><summary data-i="q2"></summary><p data-i="a2"></p></details>
        <details><summary data-i="q3"></summary><p data-i="a3"></p></details>
      </div>
    </div>

    <div>
      <form class="form" name="shipcalc-maletas" method="POST" data-netlify="true" netlify-honeypot="bot-field" data-ok="bags-ok">
        <input type="hidden" name="form-name" value="shipcalc-maletas">
        <p class="sr-only"><label>No rellenar: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <h2 data-i="b-f-title"></h2>
        <p class="sub" data-i="b-f-sub"></p>
        <div class="f"><label for="b-from" data-i="b-from"></label><input id="b-from" name="recogida" required maxlength="160"></div>
        <div class="f"><label for="b-to" data-i="b-to"></label><input id="b-to" name="entrega" required maxlength="160"></div>
        <div class="row2">
          <div class="f"><label for="b-d1" data-i="b-date1"></label><input id="b-d1" type="date" name="dia_recogida" required></div>
          <div class="f"><label for="b-d2" data-i="b-date2"></label><input id="b-d2" type="date" name="dia_entrega" required></div>
        </div>
        <div class="f"><label data-i="b-n"></label>
          <div class="row3">
            <div><label for="b-s" class="note" data-i="b-small"></label><input id="b-s" type="number" name="maletas_pequenas" min="0" max="20" value="0" inputmode="numeric"></div>
            <div><label for="b-m" class="note" data-i="b-med"></label><input id="b-m" type="number" name="maletas_medianas" min="0" max="20" value="1" inputmode="numeric"></div>
            <div><label for="b-l" class="note" data-i="b-large"></label><input id="b-l" type="number" name="maletas_grandes" min="0" max="20" value="0" inputmode="numeric"></div>
          </div>
          <p class="note" style="margin-top:4px" data-i="b-sizes"></p>
        </div>
        <div class="f"><label for="b-name" data-i="f-name"></label><input id="b-name" name="nombre" required maxlength="120" autocomplete="name"></div>
        <div class="f"><label for="b-email" data-i="f-email"></label><input id="b-email" type="email" name="email" required maxlength="160" autocomplete="email"></div>
        <div class="f"><label for="b-wa" data-i="f-wa"></label><input id="b-wa" type="tel" name="whatsapp" maxlength="30" autocomplete="tel"></div>
        <div class="f"><label for="b-notes" data-i="f-notes"></label><textarea id="b-notes" name="comentarios" maxlength="1000"></textarea></div>
        <button class="submit" type="submit" data-i="f-send"></button>
        <div class="msg"></div>
        <p class="note" style="margin-top:10px" data-i="f-privacy"></p>
      </form>
      <div class="ok form" id="bags-ok"><span class="big">✓</span><h2 data-i="f-ok"></h2><p class="note" data-i="f-ok-sub"></p></div>
    </div>
  </div>
</main>

<footer><div class="wrap"><div data-i="footer"></div><div data-i="privacy"></div><div>© <span id="year"></span> ShipCalc · shipcalc.live</div></div></footer>

</html>
